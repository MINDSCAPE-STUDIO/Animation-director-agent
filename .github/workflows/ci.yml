name: Validate Agent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check bootstrap.js
      - run: node --check server.js
      - run: node --check model-router.js
      - run: node --check provider-readiness.js
      - run: npm test
      - run: node --check pixazo-ltx-provider.js
      - run: node --check omniroute-router.js
      - run: node --check generation-queue.js
      - run: node --check agents.js
      - run: node --check app.js
      - run: npm start > /tmp/mindscape-server.log 2>&1 &
      - run: sleep 2 && curl -fsS http://localhost:8787/health
      - run: cat /tmp/mindscape-server.log
      - name: Production smoke test and readiness diagnostics
        env:
          PRODUCTION_URL: https://animation-director-agent.onrender.com
        run: |
          healthy=false
          for i in $(seq 1 12); do
            if curl -fsS "$PRODUCTION_URL/health" -o /tmp/production-health.json && curl -fsS "$PRODUCTION_URL/" -o /tmp/production-home.html; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != "true" ]; then
            echo "Production liveness/homepage smoke test failed"
            exit 1
          fi
          echo "Production health response:"
          cat /tmp/production-health.json
          ready_status=$(curl -sS -o /tmp/production-ready.json -w "%{http_code}" "$PRODUCTION_URL/ready")
          echo
          echo "Production readiness HTTP $ready_status:"
          cat /tmp/production-ready.json
          echo
          if [ "$ready_status" != "200" ]; then
            echo "App is live but readiness is degraded; see missing_variables and storage details above."
            exit 1
          fi
