name: Validate Agent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check bootstrap.js
      - run: node --check server.js
      - run: node --check dashboard.js
      - run: node --check model-router.js
      - run: node --check provider-readiness.js
      - run: npm test
      - run: node --check pixazo-ltx-provider.js
      - run: node --check omniroute-router.js
      - run: node --check generation-queue.js
      - run: node --check agents.js
      - run: node --check app.js
      - run: npm start > /tmp/mindscape-server.log 2>&1 &
      - run: sleep 2 && curl -fsS http://localhost:8787/health
      - run: cat /tmp/mindscape-server.log
      - name: Production smoke test and deployment-SHA verification
        env:
          PRODUCTION_URL: https://animation-director-agent.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          deployed=false
          for i in $(seq 1 60); do
            health_status=$(curl -sS -o /tmp/production-health.json -w "%{http_code}" "$PRODUCTION_URL/health" || true)
            served_sha=$(node -e "try { const d=JSON.parse(require('fs').readFileSync('/tmp/production-health.json','utf8')); process.stdout.write(d.build_commit || ''); } catch {}")
            echo "Attempt $i: health HTTP $health_status; deployed commit ${served_sha:-unknown}"
            if [ "$health_status" = "200" ] && [ "$served_sha" = "$EXPECTED_COMMIT" ]; then
              deployed=true
              break
            fi
            sleep 5
          done
          if [ "$deployed" != "true" ]; then
            echo "Production did not serve expected commit $EXPECTED_COMMIT before timeout"
            cat /tmp/production-health.json || true
            exit 1
          fi
          echo "Expected commit is live. Health response:"
          cat /tmp/production-health.json
          ready_status=$(curl -sS -o /tmp/production-ready.json -w "%{http_code}" "$PRODUCTION_URL/ready")
          echo
          echo "Production readiness HTTP $ready_status:"
          cat /tmp/production-ready.json
          echo
          if [ "$ready_status" != "200" ]; then
            echo "Application is live but provider/storage readiness is degraded; see missing_variables and storage details above."
            exit 1
          fi
          curl -fsS "$PRODUCTION_URL/" -o /tmp/production-home.html
          auth_enabled=$(node -e "try { const d=JSON.parse(require('fs').readFileSync('/tmp/production-health.json','utf8')); process.stdout.write(String(d.auth_enabled)); } catch {}")
          if [ "$auth_enabled" != "true" ]; then
            echo "Production health endpoint does not report API authentication enabled."
            exit 1
          fi
          protected_status=$(curl -sS -o /tmp/production-protected.json -w "%{http_code}" "$PRODUCTION_URL/jobs")
          echo "Unauthenticated /jobs HTTP $protected_status:"
          cat /tmp/production-protected.json
          if [ "$protected_status" != "401" ]; then
            echo "Expected 401 from protected API route without an access key."
            exit 1
          fi
