name: Validate Agent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-placeholder
      MINDSCAPE_API_KEY: ci-placeholder
      ALLOWED_ORIGIN: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check model-router.js
      - run: node --check generation-queue.js
      - run: node --check agents.js
      - run: node --check app.js
      - run: node server.js &
      - run: sleep 2 && curl -fsS http://localhost:8787/health
      - run: curl -fsS http://localhost:8787/ready
      - run: curl -fsS -H 'Authorization: Bearer ci-placeholder' http://localhost:8787/jobs
      - run: curl -fsS -o /tmp/unauthorized.txt -w '%{http_code}' http://localhost:8787/jobs | grep -qx '401'
