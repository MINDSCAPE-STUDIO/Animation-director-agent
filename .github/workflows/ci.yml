name: Validate Agent
on:
  push:
    branches: [main, claude-development]
  pull_request:
    branches: [main, claude-development]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Smoke test the service
        run: |
          APP_ACCESS_TOKEN=ci-test-token node server.js > /tmp/mindscape-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8787/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8787/ > /tmp/mindscape-index.html
          grep --quiet 'access-client.js' /tmp/mindscape-index.html
          unauthenticated_status=$(curl --silent --output /tmp/mindscape-unauthenticated.json --write-out '%{http_code}' http://localhost:8787/jobs/not-a-real-job)
          if [ "$unauthenticated_status" != "401" ]; then
            cat /tmp/mindscape-unauthenticated.json
            echo "Expected unauthenticated API request to return 401, received $unauthenticated_status"
            exit 1
          fi
          missing_job_status=$(curl --silent --header 'Authorization: Bearer ci-test-token' --output /tmp/mindscape-missing-job.json --write-out '%{http_code}' http://localhost:8787/jobs/not-a-real-job)
          if [ "$missing_job_status" != "404" ]; then
            cat /tmp/mindscape-missing-job.json
            echo "Expected missing job to return 404, received $missing_job_status"
            exit 1
          fi
          cat /tmp/mindscape-server.log
          test -s /tmp/mindscape-server.log
