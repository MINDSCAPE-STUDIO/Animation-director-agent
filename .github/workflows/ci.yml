name: Validate Agent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check bootstrap.js
      - run: node --check server.js
      - run: node --check model-router.js
      - run: node --check omniroute-router.js
      - run: node --check generation-queue.js
      - run: node --check agents.js
      - run: node --check app.js
      - run: npm start > /tmp/mindscape-server.log 2>&1 &
      - run: sleep 2 && curl -fsS http://localhost:8787/health
      - run: cat /tmp/mindscape-server.log
      - name: Production smoke test
        env:
          PRODUCTION_URL: https://animation-director-agent.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$PRODUCTION_URL/health" && curl -fsS "$PRODUCTION_URL/ready" && curl -fsS "$PRODUCTION_URL/"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke test failed"
          exit 1
