name: Validate Agent
on:
  push:
    branches: [main, claude-development]
  pull_request:
    branches: [main, claude-development]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Smoke test the service
        run: |
          node server.js > /tmp/mindscape-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8787/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mindscape-server.log
          exit 1

