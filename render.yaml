services:
  - type: web
    name: mindscape-animation-director
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: VIDEO_PROVIDER
        value: hf_space
      - key: HF_SPACE_NAME
        value: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      - key: HF_TOKEN
        sync: false
      - key: VIDEO_RESOLUTION
        value: 480p
      - key: IMAGE_PROVIDER
        value: google
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: VISION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
