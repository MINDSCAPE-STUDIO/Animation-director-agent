services:
  - type: web
    name: mindscape-animation-director
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: VIDEO_PROVIDER
        value: qwencloud
      - key: QWEN_CLOUD_API_KEY
        sync: false
      - key: QWEN_I2V_MODEL
        value: wan2.7-i2v
      - key: QWEN_T2V_MODEL
        value: wan2.7-t2v
      - key: VIDEO_RESOLUTION
        value: 720P
      - key: IMAGE_PROVIDER
        value: google
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: VISION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: PIXAZO_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://animation-director-agent.onrender.com
      - key: MINDSCAPE_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PROVIDER_POLL_INTERVAL_MS
        value: '5000'
      - key: PROVIDER_POLL_TIMEOUT_MS
        value: '900000'
