services:
  - type: web
    name: mindscape-animation-director
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: VIDEO_PROVIDER
        value: hf_space
      - key: HF_SPACE_NAME
        value: OpenKing/wan2-video-generation
      - key: HF_TOKEN
        sync: false
      - key: VIDEO_RESOLUTION
        value: 480p
      - key: HF_VIDEO_WIDTH
        value: '512'
      - key: HF_VIDEO_HEIGHT
        value: '288'
      - key: HF_VIDEO_STEPS
        value: '25'
      - key: HF_VIDEO_GUIDANCE
        value: '5'
      - key: IMAGE_PROVIDER
        value: hf_image
      - key: HF_IMAGE_SPACE_NAME
        value: Qwen/Qwen-Image-2.1
      - key: IMAGE_MODEL
        value: Qwen/Qwen-Image-2.1
      - key: VISION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: MINDSCAPE_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PROVIDER_POLL_INTERVAL_MS
        value: '5000'
      - key: PROVIDER_POLL_TIMEOUT_MS
        value: '900000'
